name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  sql-syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnestra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Provision Supabase platform objects + the NON-SUPERUSER apply role
        # Mnestra's migrations target a Supabase database. Supabase provides
        # the anon / authenticated / service_role roles and the Vault schema;
        # a vanilla pgvector/pgvector:pg16 container has neither. Migrations
        # 006/010/014/019/020 GRANT/REVOKE against those roles, and migration
        # 016's mnestra_doctor_vault_secret_exists is a `language sql` function
        # whose body is parse-time-resolved at CREATE, so vault.secrets must
        # exist. Pre-create both so the migrations apply exactly as they do on
        # Supabase. (016's cron.* probes are self-guarded behind a pg_cron
        # pg_extension check, so no cron shim is needed.) IF NOT EXISTS keeps
        # the step re-runnable.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mnestra_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name       text UNIQUE,
            secret     text,
            created_at timestamptz NOT NULL DEFAULT now()
          );

          -- Sprint 83 T1. Install the extensions into an `extensions` schema,
          -- as Supabase does, rather than letting migration 001 drop them into
          -- `public`. 019/029/033/034 all pin `search_path = public, extensions,
          -- pg_catalog` precisely because that is where they live in production;
          -- with them in `public` those pins are satisfied by accident and the
          -- schema-qualification behaviour is never exercised. 001's
          -- `create extension if not exists` is then a no-op, as it is on prod.
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS vector   SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS pg_trgm  SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto SCHEMA extensions;

          -- Sprint 83 T1. Every migration below is applied by `app`, a
          -- NON-SUPERUSER role, because Supabase's `postgres` is not a superuser
          -- (usesuper = f) and applying as one hides a whole class of failure.
          --
          -- Concretely, this is the fence for the 2026-07-31 live incident:
          -- `CREATE FUNCTION ... SET hnsw.ef_search` fails with "permission
          -- denied to set parameter" for a non-superuser whenever pgvector's
          -- library is not yet loaded in the backend (the GUC is a placeholder
          -- until then, and Postgres will not let a non-superuser pin a
          -- placeholder into proconfig). As superuser it silently succeeds.
          -- Verified on BOTH pg16 and pg17 — the discriminator is the ROLE, not
          -- the server version, so this needs no image bump.
          --
          -- The role gets exactly what Supabase's postgres has and no more:
          -- ownership of `public`, CREATE on the database (migration 024 creates
          -- the `private` schema), USAGE on extensions. Still NOSUPERUSER, so a
          -- migration that quietly requires superuser now fails HERE instead of
          -- in production.
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app') THEN
              CREATE ROLE app LOGIN PASSWORD 'postgres' NOSUPERUSER CREATEROLE;
            END IF;
          END
          $$;

          GRANT CREATE, CONNECT, TEMPORARY ON DATABASE mnestra_test TO app;
          ALTER SCHEMA public OWNER TO app;
          GRANT ALL   ON SCHEMA public     TO app;
          GRANT USAGE ON SCHEMA extensions TO app, anon, authenticated, service_role;
          GRANT ALL   ON SCHEMA vault      TO app;
          GRANT ALL   ON ALL TABLES IN SCHEMA vault TO app;
          ALTER ROLE app SET search_path = public, extensions, pg_catalog;
          SQL

      - name: Confirm the apply role is NOT a superuser
        # A one-line guard so this fence cannot rot silently: if someone later
        # grants app superuser, or the apply steps drift back to -U postgres,
        # the masking returns and nothing else would notice.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U app -d mnestra_test -v ON_ERROR_STOP=1 -t -c \
            "select case when usesuper then 'FAIL: apply role is a superuser; the hnsw.ef_search class is masked' else 'ok: non-superuser apply role' end from pg_user where usename = current_user" \
            | tee /dev/stderr | grep -q '^ *ok:'

      - name: Apply migrations in order
        # Sprint 82 T1: split at 033 so the behavioral test can capture what
        # migration 032 actually does BEFORE 033 replaces it. The equivalence
        # assertion in tests/sql/033b_verify.sql then compares against the real
        # 032 function rather than a hand-copied reference of it, which is the
        # only version of that test that cannot drift.
        #
        # Every migration still applies, in order: 001..032, baseline capture,
        # 033, then Sprint 83's pre-034 fixtures, then 034 and anything after.
        # `10#` forces base-10 so `008`/`009` are not misread as octal.
        #
        # Sprint 83 T1 adds the second split. 034's central backward-compat claim
        # is "every edge that existed before me is still valid after me", and the
        # only fixture that can test it is one that genuinely pre-dates 034 —
        # including an edge whose relationship_type 034's hard-coded list has
        # never heard of, which is what forces 034's adopt-DISTINCT pass to be
        # real. Seeding after 034 would prove something else entirely. (034a
        # refuses to run if 034 has already been applied, so this ordering cannot
        # silently rot into a vacuous test.)
        env:
          PGPASSWORD: postgres
        run: |
          apply_range() {
            for file in migrations/*.sql; do
              n=$((10#$(basename "$file" | cut -d_ -f1)))
              if [ "$n" -ge "$1" ] && [ "$n" -le "$2" ]; then
                echo "Applying $file"
                psql -h localhost -U app -d mnestra_test -v ON_ERROR_STOP=1 -f "$file"
              fi
            done
          }
          apply_range 1 32
          echo "Seeding migration-033 fixtures + capturing pre-033 baseline"
          psql -h localhost -U app -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/033a_seed_and_baseline.sql
          apply_range 33 33
          echo "Seeding migration-034 pre-034 legacy edges (incl. an unknown relationship_type)"
          psql -h localhost -U app -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/034a_seed_legacy_edges.sql
          apply_range 34 999

      - name: Verify migration 033 behavior, index usage, and hygiene gates
        # Self-checking: every assertion RAISEs on failure, so a green step is
        # the acceptance evidence. -e echoes each statement so the captured
        # EXPLAIN plans are readable in the run log.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U app -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/033b_verify.sql

      - name: Verify migration 034 graph layer, label producer, and hygiene gates
        # Same self-checking contract as 033b: every assertion RAISEs, so a green
        # step IS the acceptance evidence. Covers legacy-edge survival across the
        # vocabulary FK swap, the history-preserving valid_at backfill,
        # invalidate-don't-delete + resurrection, REQ-1 expansion semantics,
        # entity convergence, citation idempotency reaching fit-platt's real
        # query, and the repaired solved-problem decay profile.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U app -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/034b_verify.sql
