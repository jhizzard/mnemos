name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  sql-syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnestra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Provision Supabase platform objects
        # Mnestra's migrations target a Supabase database. Supabase provides
        # the anon / authenticated / service_role roles and the Vault schema;
        # a vanilla pgvector/pgvector:pg16 container has neither. Migrations
        # 006/010/014/019/020 GRANT/REVOKE against those roles, and migration
        # 016's mnestra_doctor_vault_secret_exists is a `language sql` function
        # whose body is parse-time-resolved at CREATE, so vault.secrets must
        # exist. Pre-create both so the migrations apply exactly as they do on
        # Supabase. (016's cron.* probes are self-guarded behind a pg_cron
        # pg_extension check, so no cron shim is needed.) IF NOT EXISTS keeps
        # the step re-runnable.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mnestra_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE TABLE IF NOT EXISTS vault.secrets (
            id         uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name       text UNIQUE,
            secret     text,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
      - name: Apply migrations in order
        # Sprint 82 T1: split at 033 so the behavioral test can capture what
        # migration 032 actually does BEFORE 033 replaces it. The equivalence
        # assertion in tests/sql/033b_verify.sql then compares against the real
        # 032 function rather than a hand-copied reference of it, which is the
        # only version of that test that cannot drift.
        #
        # Every migration still applies, in order: 001..032, baseline capture,
        # 033, then Sprint 83's pre-034 fixtures, then 034 and anything after.
        # `10#` forces base-10 so `008`/`009` are not misread as octal.
        #
        # Sprint 83 T1 adds the second split. 034's central backward-compat claim
        # is "every edge that existed before me is still valid after me", and the
        # only fixture that can test it is one that genuinely pre-dates 034 —
        # including an edge whose relationship_type 034's hard-coded list has
        # never heard of, which is what forces 034's adopt-DISTINCT pass to be
        # real. Seeding after 034 would prove something else entirely. (034a
        # refuses to run if 034 has already been applied, so this ordering cannot
        # silently rot into a vacuous test.)
        env:
          PGPASSWORD: postgres
        run: |
          apply_range() {
            for file in migrations/*.sql; do
              n=$((10#$(basename "$file" | cut -d_ -f1)))
              if [ "$n" -ge "$1" ] && [ "$n" -le "$2" ]; then
                echo "Applying $file"
                psql -h localhost -U postgres -d mnestra_test -v ON_ERROR_STOP=1 -f "$file"
              fi
            done
          }
          apply_range 1 32
          echo "Seeding migration-033 fixtures + capturing pre-033 baseline"
          psql -h localhost -U postgres -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/033a_seed_and_baseline.sql
          apply_range 33 33
          echo "Seeding migration-034 pre-034 legacy edges (incl. an unknown relationship_type)"
          psql -h localhost -U postgres -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/034a_seed_legacy_edges.sql
          apply_range 34 999

      - name: Verify migration 033 behavior, index usage, and hygiene gates
        # Self-checking: every assertion RAISEs on failure, so a green step is
        # the acceptance evidence. -e echoes each statement so the captured
        # EXPLAIN plans are readable in the run log.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/033b_verify.sql

      - name: Verify migration 034 graph layer, label producer, and hygiene gates
        # Same self-checking contract as 033b: every assertion RAISEs, so a green
        # step IS the acceptance evidence. Covers legacy-edge survival across the
        # vocabulary FK swap, the history-preserving valid_at backfill,
        # invalidate-don't-delete + resurrection, REQ-1 expansion semantics,
        # entity convergence, citation idempotency reaching fit-platt's real
        # query, and the repaired solved-problem decay profile.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mnestra_test -v ON_ERROR_STOP=1 \
            -f tests/sql/034b_verify.sql
